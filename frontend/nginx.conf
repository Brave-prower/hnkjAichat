# =====================================================
# Nginx 配置：托管 Vue 静态资源 + 反向代理 /api 到后端
# =====================================================

server {
    listen 80;
    server_name _;

    # 前端项目根目录（与 Dockerfile 中 COPY 目标保持一致）
    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # 静态资源缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # ===== 反向代理：/api -> backend:8080 =====
    # 后端 context-path=/api，因此这里直接转发到 8080，路径保持 /api/...
    # 注意：
    # 1) 关闭缓冲，否则 SSE 流式问答会被 Nginx 缓存住
    # 2) 放宽超时，避免长连接被掐断
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # SSE 必备：关闭代理缓冲、关闭缓存
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA 兜底：所有未命中的路径都回到 index.html，让 Vue Router 接管
    location / {
        try_files $uri $uri/ /index.html;
    }
}
