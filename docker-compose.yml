# =====================================================
# 校园问答系统 - 全栈 Docker Compose
# 服务：PostgreSQL+pgvector  /  Spring Boot 后端  /  Vue 前端（Nginx）
#
# 启动前必做：复制 .env.example 为 .env，填入两个 Key
#   cp .env.example .env      （Windows: copy .env.example .env）
#
# 启动：docker compose up -d --build
# 访问：http://localhost                       -> 前端（上传 / 问答）
#       http://localhost/api/swagger-ui.html   -> 后端接口文档
#       localhost:5432                         -> 数据库（外部工具可直连）
# =====================================================

services:
  # -------------------- 数据库 --------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: campus-qa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_qa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动启用 pgvector 扩展
      - ./docs/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_qa"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campus-net

  # -------------------- 后端 --------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: campus-qa/backend:1.0.0
    container_name: campus-qa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 数据库连接（用 compose 服务名作为主机名）
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: campus_qa
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      # ---- 生成回答：DeepSeek（必需，缺失则每次提问只能返回制度原文兜底）----
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}

      # ---- 向量化：硅基流动 bge-m3（可选，未配置则自动降级为关键词检索）----
      # 注意：OPENAI_BASE_URL 不能带 /v1，Spring AI 会自己拼 /v1/embeddings
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.siliconflow.cn}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-BAAI/bge-m3}

      # 运行环境：local = 普通表 + Java 余弦检索（无需 pgvector 扩展）
      # 想在容器里验证 pgvector 方案时改为 railway（需同时把 dimensions 改为 1024）
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      # 上传文件持久化（容器重建不丢）
      - campus-uploads:/app/uploads
    networks:
      - campus-net

  # -------------------- 前端 --------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: campus-qa/frontend:1.0.0
    container_name: campus-qa-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 浏览器只需记一个端口：80 -> Nginx -> 反代 /api 到 backend
      - "80:80"
    networks:
      - campus-net

# -------------------- 持久化卷 --------------------
volumes:
  pgdata:
  campus-uploads:

# -------------------- 网络 --------------------
networks:
  campus-net:
    driver: bridge
